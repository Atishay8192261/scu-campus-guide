services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: scu_guide
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: ${GUIDE_DB_PASSWORD:?Set a random GUIDE_DB_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:${GUIDE_DB_PORT:-55441}:5432"
    volumes:
      - guide_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d scu_guide"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  guide_db:
