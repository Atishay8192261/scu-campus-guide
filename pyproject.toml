[project]
name = "scu-campus-guide"
version = "0.1.0"
description = "Independent, evidence-grounded SCU voice guide"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "beautifulsoup4>=4.12,<5", "pypdf>=6,<7",
  "pipecat-ai[webrtc,openai,deepgram,elevenlabs]==0.0.108",
  "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1", "pip-audit>=2.9,<3", "playwright>=1.50,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
